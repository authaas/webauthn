syntax = "proto3";

package webauthn.authenticator;

import "webauthn/authenticator/attachment.proto";
import "webauthn/requirement/resident_key.proto";
import "webauthn/requirement/user_verification.proto";

message SelectionCriteria {
  Attachment authenticator_attachment = 1;
  requirement.ResidentKey resident_key = 2;
  bool require_resident_key = 3;
  requirement.UserVerification user_verification = 4;
}
