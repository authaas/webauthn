syntax = "proto3";

package webauthn.authenticator.assertion;

import "identity/id.proto";
import "webauthn/authenticator/assertion/data.proto";
import "webauthn/authenticator/assertion/signature.proto";
import "webauthn/client_data/json.proto";

// Authenticator response to the login ceremony
message Response {
  client_data.JSON client_data_json = 1;
  Data authenticator_data = 2;
  Signature signature = 3;
  identity.ID user_handle = 4;
}
