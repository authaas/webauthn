syntax = "proto3";

package webauthn.public_key_credential;

import "webauthn/challenge.proto";
import "webauthn/extensions/request.proto";
import "webauthn/public_key_credential/descriptor.proto";
import "webauthn/relying_party.proto";
import "webauthn/requirement/user_verification.proto";

message RequestOptions {
  webauthn.Challenge challenge = 1;
  uint32 timeout = 2;
  webauthn.RpId rp_id = 3;
  repeated Descriptor allow_credentials = 4;
  requirement.UserVerification user_verification = 5;
  repeated string hints = 6;
  extensions.Request extensions = 7;
}
