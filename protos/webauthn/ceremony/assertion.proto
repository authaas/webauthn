syntax = "proto3";

package webauthn.ceremony;

import "webauthn/authenticator/assertion/response.proto";
import "webauthn/authenticator/attachment.proto";
import "webauthn/credential/id.proto";
import "webauthn/extensions/response.proto";

message Assertion {
  credential.ID credential = 1;
  authenticator.Attachment authenticator_attachment = 2;
  extensions.Response client_extension_results = 3;
  authenticator.assertion.Response response = 4;
}
